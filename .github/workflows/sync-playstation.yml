name: Sync PlayStation

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Cate jocuri (0 = toate, 2 pentru test)'
        required: false
        default: '0'
      new_only:
        description: 'Doar randuri noi? (1 = da, doar jocuri fara date)'
        required: false
        default: '0'
  workflow_call:

concurrency:
  group: ${{ github.event_name == 'schedule' && format('scheduled-playstation-{0}', github.run_id) || 'games-db-sheets-sync' }}
  queue: max

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - name: Run sync
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          LIMIT: ${{ github.event.inputs.limit }}
          NEW_ONLY: ${{ github.event.inputs.new_only }}
        run: node sync-playstation.js
