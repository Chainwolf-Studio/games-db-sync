name: Sync Play Store

on:
  # Rulare manuala (butonul "Run workflow" din tab-ul Actions)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Cate jocuri (0 = toate, pune 2 pentru test)'
        required: false
        default: '0'
  # Rulare automata zilnica la 03:00 UTC (05:00 ora Romaniei vara)
  schedule:
    - cron: '0 3 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run sync
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          LIMIT: ${{ github.event.inputs.limit }}
          NEW_ONLY: ${{ github.event.inputs.new_only }}
        run: npm run sync
